name: Azure Static Web Apps CI/CD

on:
    push:
        branches:
            - main
    pull_request:
        types: [opened, synchronize, reopened, closed]
        branches:
            - main

permissions:
    contents: write

jobs:
    build_and_deploy_job:
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
        runs-on: ubuntu-latest
        name: Build and Deploy Job
        steps:
            - uses: actions/checkout@v3
              with:
                  submodules: true
                  lfs: false
            - name: npm install, build, and test
              run: |
                  # Build and test the project, then
                  # deploy to Azure Web App.
                  npm ci
                  npm run build
            - name: Build And Deploy
              id: builddeploy
              uses: Azure/static-web-apps-deploy@v1
              with:
                  azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_BAY_0FCFC3B10 }}
                  repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
                  action: 'upload'
                  ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
                  # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
                  app_location: '/dist' # App source code path
                  api_location: 'Api' # Api source code path - optional
                  output_location: '/Dist' # Built app content directory - optional
                  ###### End of Repository/Build Configurations ######
            - name: Generate ZIP size badge
              if: github.event_name == 'push'
              run: |
                  SIZE=$(stat -c%s dist/Unicorn.zip)
                  KIB=$(awk "BEGIN {printf \"%.2f\", $SIZE / 1024}")

                  if [ "$SIZE" -le 13312 ]; then
                      COLOR="green"
                  else
                      COLOR="red"
                  fi

                  cat > /tmp/badge.json << EOF
                  {
                    "schemaVersion": 1,
                    "label": "ZIP",
                    "message": "${KIB} KiB",
                    "color": "${COLOR}"
                  }
                  EOF

                  echo "Unicorn.zip: ${SIZE} bytes (${KIB} KiB)"

            - name: Update badge branch
              if: github.event_name == 'push'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  git fetch origin badge || true

                  if git show-ref --verify --quiet refs/remotes/origin/badge; then
                      git checkout -B badge origin/badge
                  else
                      git checkout --orphan badge
                      git rm -rf . || true
                  fi

                  cp /tmp/badge.json badge.json

                  git add badge.json
                  git commit -m "Update ZIP size badge" || true
                  git push origin badge --force

    close_pull_request_job:
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        runs-on: ubuntu-latest
        name: Close Pull Request Job
        steps:
            - name: Close Pull Request
              id: closepullrequest
              uses: Azure/static-web-apps-deploy@v1
              with:
                  azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_BAY_0FCFC3B10 }}
                  action: 'close'
